plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 28

        python {
            // CI (Linux) 用系统 Python，本地 Windows 用 PATH 上的 python
            if (System.getProperty('os.name').toLowerCase().contains('linux')) {
                // CI 用 setup-python 安装的版本（在PATH上）
                buildPython("python3")
            } else {
                // 通用：使用 PATH 上的 python；本机如需指定绝对路径可在此覆盖
                buildPython("python")
            }
            pip {
                install "lxml"
                install "ujson"
                install "pyquery==1.4.3"
                install "requests"
                install "jsonpath"
                install "cachetools"
                install "pycryptodome"
                install "beautifulsoup4"
            }
        }
    }

    flavorDimensions "abi"

    productFlavors {
        armeabi {
            dimension = "abi"
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }

        arm64 {
            dimension = "abi"
            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        x86 {
            dimension = "abi"
            ndk {
                abiFilters 'x86'
            }
        }

        x86_64 {
            dimension = "abi"
            ndk {
                abiFilters 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // Android代码模块
            setRoot "src/main"
            // Python代码模块，也就是你的Python源码所在项目中的文件夹
            python.srcDirs = ["src/python"]
        }
    }

}

dependencies {

}
