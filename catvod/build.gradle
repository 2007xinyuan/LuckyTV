plugins {
    id 'com.android.library'
}

android {
    namespace = 'com.github.catvod.crawler'
    compileSdk 34
    lint {
        abortOnError false
    }

    defaultConfig {
        minSdk 21
        targetSdk 28
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api 'androidx.annotation:annotation:1.8.0'
    api 'org.brotli:dec:0.1.2'
    api 'com.squareup.okhttp3:okhttp:3.12.11'
    api 'com.squareup.okhttp3:okhttp-dnsoverhttps:3.12.11'
    api 'com.squareup.okhttp3:logging-interceptor:3.12.11'
    api 'com.google.code.gson:gson:2.10.1'
    api 'com.google.guava:guava:31.0.1-android'
    api 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
    api 'com.orhanobut:logger:2.2.0'
    api 'androidx.preference:preference:1.2.0'
    api 'com.github.thegrizzlylabs:sardine-android:0.8'
    api 'com.hierynomus:smbj:0.11.1'
    api 'androidx.startup:startup-runtime:1.1.1'
    api 'com.google.zxing:core:3.5.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

android.lintOptions {
    checkReleaseBuilds false
    abortOnError false
    checkAllWarnings false
    warningsAsErrors false
}
